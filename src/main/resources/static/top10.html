<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="top10.css">
    <title>top10</title>
</head>
<body>
<nav>
    <a href="index.html">Home</a>
</nav>
<div class="city-page">

    <h1>Top 10 Canadian Cities</h1>

    <div class="city-list">
        <button class="city-btn"
                data-city="Vancouver"
                data-lat="49.2827"
                data-lon="-123.1207">
            Vancouver
        </button>

        <button class="city-btn"
                data-city="New York"
                data-lat="40.7128"
                data-lon="-74.0060">
            New York
        </button>

        <button class="city-btn"
                data-city="London"
                data-lat="51.5074"
                data-lon="-0.1278">
            London
        </button>

        <button class="city-btn"
                data-city="Paris"
                data-lat="48.8566"
                data-lon="2.3522">
            Paris
        </button>

        <button class="city-btn"
                data-city="Tokyo"
                data-lat="35.6762"
                data-lon="139.6503">
            Tokyo
        </button>

        <button class="city-btn"
                data-city="Seoul"
                data-lat="37.5665"
                data-lon="126.9780">
            Seoul
        </button>

        <button class="city-btn"
                data-city="Singapore"
                data-lat="1.3521"
                data-lon="103.8198">
            Singapore
        </button>

        <button class="city-btn"
                data-city="Sydney"
                data-lat="-33.8688"
                data-lon="151.2093">
            Sydney
        </button>

        <button class="city-btn"
                data-city="Dubai"
                data-lat="25.2048"
                data-lon="55.2708">
            Dubai
        </button>

        <button class="city-btn"
                data-city="Hong Kong"
                data-lat="22.3193"
                data-lon="114.1694">
            Hong Kong
        </button>
    </div>


    <div class="weather-card">

        <h2 id="city-name">Select a City</h2>

        <p>
            Temperature:
            <span id="temperature">--</span>
        </p>

        <p>
            Wind:
            <span id="wind">--</span>
        </p>

        <p>
            Humidity:
            <span id="humidity">--</span>
        </p>

    </div>

</div>

<script src="top10.js"></script>
</body>
</html>
